{% extends "base.html" %}
{% block content %}
<section class="page-heading">
  <p class="eyebrow">Credencial temporal</p>
  <h1>{{ heading }}</h1>
  <p>Correo: <strong>{{ correo }}</strong></p>
</section>
<section class="student-account-form-panel" aria-labelledby="temporary-title">
  <h2 id="temporary-title">Contraseña temporal</h2>
  <p id="temporary-password" class="temporary-password">{{ password_temporal }}</p>
  <p class="password-warning">⚠ Esta contraseña sólo se mostrará en esta pantalla.</p>
  <button class="button button-primary" type="button" data-copy-target="temporary-password">Copiar contraseña</button>
  <a class="button button-secondary bordered-button" href="{{ return_url }}">Continuar</a>
</section>
<script>
document.querySelector('[data-copy-target]').addEventListener('click', function () {
  navigator.clipboard.writeText(document.getElementById(this.dataset.copyTarget).textContent);
});
</script>
{% endblock %}
